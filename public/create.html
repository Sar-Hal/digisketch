<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Create Note - DigiSketch</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="container flex flex-col gap-6" style="padding-bottom: 6rem;">
    
    <div id="wizard-view" class="glass-card flex flex-col w-full" style="padding: 0;">
      <!-- Progress Bar -->
      <div class="progress-bar px-6 pt-6" id="progress-bar">
        <div class="progress-step active"></div>
        <div class="progress-step"></div>
        <div class="progress-step"></div>
        <div class="progress-step"></div>
      </div>

      <div class="p-6 sm:p-8 flex flex-col gap-8">
        
        <div class="flex flex-col items-center gap-2 text-center">
          <span id="step-badge" class="text-xs uppercase tracking-wider text-accent font-bold" style="letter-spacing: 0.05em;">Step 1 of 4</span>
          <h1 id="step-title" class="text-2xl sm:text-3xl font-bold">First Sketch</h1>
          <p id="step-desc" class="text-sm sm:text-base text-zinc-500 max-w-sm">Draw a tiny memory. Keep it simple and pixel-y.</p>
        </div>

        <!-- Canvas Area (Steps 1-3) -->
        <div id="canvas-area" class="flex flex-col gap-8">
          <div class="mx-auto w-full max-w-[280px]">
            <div id="canvas-container"></div>
            <p class="text-center mt-4" style="font-size: 13px; color: #71717a; font-weight: 500;">Drag to draw. Tap to paint. Tiny grids only.</p>
          </div>
          
          <div class="flex flex-col items-center gap-4 w-full">
            <div id="palette-container" class="flex flex-wrap justify-center gap-3 mx-auto" style="max-width: 260px;"></div>
            
            <div class="flex items-center justify-between w-full mx-auto" style="max-width: 260px; padding: 0 0.5rem;">
              <div class="flex gap-3">
                <button id="brush-1" class="brush-size active" aria-label="1x1 Brush">
                  <div style="width: 6px; height: 6px; background: currentColor; border-radius: 1px;"></div>
                </button>
                <button id="brush-2" class="brush-size" aria-label="2x2 Brush">
                  <div style="width: 14px; height: 14px; background: currentColor; border-radius: 2px;"></div>
                </button>
              </div>
              <button id="clear-btn" class="btn" style="background: none; padding: 0; font-size: 0.875rem; font-weight: 500; color: #a1a1aa; box-shadow: none; text-decoration: underline; text-underline-offset: 4px; margin: 0; width: auto;">Clear Canvas</button>
            </div>
          </div>
        </div>

        <!-- Message Area (Step 4) -->
        <div id="message-area" class="mx-auto flex w-full max-w-[320px] flex-col gap-2" style="display: none;">
          <textarea id="message-input" rows="5" maxlength="280" placeholder="Type your message here..."></textarea>
          <div class="flex items-center justify-between px-1" style="font-size: 0.75rem; color: #a1a1aa;">
            <span>Max 280 characters</span>
            <span id="char-count" style="font-weight: 500;">0/280</span>
          </div>
        </div>

        <div id="error-msg" style="display: none; border-radius: 12px; background: #fef2f2; padding: 1rem; font-size: 0.875rem; color: #dc2626; border: 1px solid #fecaca; margin-top: 1rem;"></div>

        <!-- Navigation -->
        <div class="flex flex-col sm:flex-row-reverse sm:justify-between gap-3 mt-8">
          <button id="next-btn" class="btn btn-primary">Next</button>
          <button id="back-btn" class="btn btn-secondary">Back</button>
        </div>
      </div>
    </div>

    <!-- Success View -->
    <div id="success-view" class="glass-card flex flex-col text-center" style="display: none;">
      <h1 class="text-3xl font-bold mb-4">Your note is sealed.</h1>
      <p class="mb-6">Copy the link below and send it to someone special.</p>
      
      <div class="flex flex-col sm:flex-row gap-3 items-center w-full mb-8">
        <input id="share-url" readonly class="w-full" style="padding: 1rem; border-radius: 16px; border: none; background: #fafafa; box-shadow: inset 0 2px 4px rgba(0,0,0,0.06), inset 0 0 0 1px rgba(0,0,0,0.05); font-size: 0.875rem; color: #52525b; outline: none;">
        <button id="copy-btn" class="btn btn-primary sm:shrink-0" style="padding: 1rem 1.5rem;">Copy link</button>
      </div>

      <div class="flex flex-col sm:flex-row sm:justify-center gap-3">
        <a id="preview-link" href="#" class="btn btn-primary">Preview note</a>
        <a href="/create" class="btn btn-secondary">Make another</a>
      </div>
    </div>
  </main>

  <script src="/create.js"></script>
</body>
</html>
